<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 3D Isometric Gold Cube Icon -->
  <g transform="translate(40, 20)">
    <!-- Top Face (Yellow/Gold) -->
    <path d="M60 10 L105 32 L60 55 L15 32 Z" fill="#f59e0b" />
    <path d="M60 10 L105 32 L95 37 L50 15 Z" fill="#fbbf24" opacity="0.6" />
    
    <!-- Right Face (Amber/Orange) -->
    <path d="M60 55 L105 32 L105 85 L60 110 Z" fill="#d97706" />
    <path d="M105 32 L105 85 L95 80 L95 37 Z" fill="#b45309" opacity="0.5" />
    
    <!-- Left Face (Deep Golden Brown/Navy) -->
    <path d="M15 32 L60 55 L60 110 L15 85 Z" fill="#eab308" />
    <path d="M60 55 L60 110 L50 105 L50 50 Z" fill="#ca8a04" opacity="0.4" />
    
    <!-- Cutout White Angle Inside -->
    <path d="M60 55 L60 75 L38 64 L38 44 Z" fill="#ffffff" />
    <path d="M60 55 L82 44 L82 64 L60 75 Z" fill="#f1f5f9" />
  </g>

  <!-- English Subtitle: Amiran Packaging & Printing -->
  <text x="100" y="160" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" fill="#f59e0b" text-anchor="middle" letter-spacing="0.2">
    Amiran Packaging &amp; Printing
  </text>
</svg>
