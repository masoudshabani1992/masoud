name: APK to repo (manual)

# Manually triggered: builds the debug APK and commits it to apk/manoosh-debug.apk
# on the selected branch, so it can be downloaded straight from the repository.
# Trigger: Actions tab > "APK to repo (manual)" > Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Build APK and commit to repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Commit APK to apk/
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/manoosh-debug.apk
          ls -la apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk/manoosh-debug.apk
          if git diff --staged --quiet; then
            echo "APK unchanged, nothing to commit."
          else
            git commit -m "chore: update debug APK [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
