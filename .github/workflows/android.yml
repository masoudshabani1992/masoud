name: Android build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manoosh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Annotate errors on failure
        if: failure()
        run: |
          python3 - <<'PYEOF'
          import re
          try:
              log = open('build.log', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print('::error::build.log not found; the build step produced no output')
              raise SystemExit
          m = re.search(r'What went wrong:(.*?)(?:\n\n[A-Z]|\Z)', log, re.S)
          section = (m.group(1).strip() if m else log[-3000:]).strip()
          section = section[:3000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error::{section}')
          for pat in [r'^e: .+$', r'FAILED$', r'error: .+']:
              for line in re.findall(pat, log, re.M)[:5]:
                  line = line.strip()[:400].replace('%', '%25')
                  print(f'::error::{line}')
          PYEOF

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  release:
    name: Build release AAB/APK
    runs-on: ubuntu-latest
    # Runs only on version tags. Requires signing secrets (see docs/BUILD_AND_PUBLISH_FA.md).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify signing secrets
        run: |
          if [ "$HAS_KEYSTORE" != "true" ]; then
            echo "::error::Signing secrets are not configured. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Settings > Secrets > Actions. See docs/BUILD_AND_PUBLISH_FA.md"
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/manoosh.keystore
          echo "KEYSTORE_PATH=/tmp/manoosh.keystore" >> $GITHUB_ENV
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release
        run: gradle :app:assembleRelease :app:bundleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: manoosh-release-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: manoosh-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
