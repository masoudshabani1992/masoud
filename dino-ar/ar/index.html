<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>بازیکا — استند زندهٔ دایناسورها</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦖</text></svg>" />
  <link rel="stylesheet" href="ui.css?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet" />
  <script src="../vendor/three.min.js"></script>
  <script src="../vendor/GLTFLoader.js"></script>
  <script src="app.js?v=2"></script>
</head>
<body>
  <div id="stage"></div>

  <div id="ui">
    <div id="brand"><img src="../assets/logo.png" alt="بازیکا" onerror="this.parentNode.remove()" /></div>
    <div id="hint">🦖 روی دایناسورها ضربه بزنید!</div>
    <div id="diag"></div>

    <!-- نوار پایین: پخش صدای راوی + اطلاعات -->
    <div id="bottombar">
      <button id="btnPlay" class="big-btn">▶<span>صدای راوی</span></button>
      <button id="btnInfo" class="big-btn">ℹ<span>اطلاعات</span></button>
    </div>

    <!-- پاپ‌آپ اطلاعات هر دایناسور با ضربه روی آن -->
    <div id="popup" class="sheet">
      <div class="box">
        <button class="close" id="popupClose" aria-label="بستن">✖</button>
        <img id="popupImg" alt="" />
        <h3 id="popupName"></h3>
        <ul id="popupRows"></ul>
        <p id="popupFact" class="fact"></p>
      </div>
    </div>

    <!-- پنل متن اطلاعات (دکمهٔ ℹ) -->
    <div id="infoPanel" class="sheet">
      <div class="box">
        <button class="close" onclick="document.querySelector('#infoPanel').classList.remove('open')" aria-label="بستن">✖</button>
        <h3>دربارهٔ این استند 🦖</h3>
        <p id="infoText">متن اطلاعات به‌زودی بارگذاری می‌شود…</p>
      </div>
    </div>

    <div id="toast"></div>
  </div>
</body>
</html>
