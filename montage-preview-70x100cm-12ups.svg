      .title-block-bg { fill: #f8fafc; stroke: #1e293b; stroke-width: 1.5; }
      .tb-text-bold { font-family: 'Vazirmatn', sans-serif; font-size: 8.5px; font-weight: 900; fill: #0f172a; }
