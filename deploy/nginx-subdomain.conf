# ====================================================================
# پیکربندی Nginx برای استقرار سامانه اتوماسیون کارخانه جعبه‌سازی روی ساب‌دامین
# مسیر پیشنهادی: /etc/nginx/sites-available/order.yourdomain.com
# ====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name order.yourdomain.com; # دامنه / ساب‌دامین خود را اینجا وارد کنید

    # هدایت خودکار تمام درخواست‌های HTTP به HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name order.yourdomain.com;

    # گواهی امنیتی SSL (تولید شده با Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/order.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/order.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # تنظیمات آپلود فایل‌های حجیم طراحی (خط تیغ، خروجی‌های سنگین)
    client_max_body_size 50M;

    # پروکسی معکوس به پورت اجرای برنامه Node.js
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تنظیم تایم‌اوت برای محاسبات و درخواست‌های طولانی
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # لاگ‌های دسترسی و خطا
    access_log /var/log/nginx/boxfactory_access.log;
    error_log /var/log/nginx/boxfactory_error.log;
}
